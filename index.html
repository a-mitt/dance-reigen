@keyframes slide{to{background-position:300% 300%}}
.dot{position:absolute;border-radius:50%;pointer-events:none;animation:pop .9s ease-out forwards;z-index:3}
@keyframes pop{from{transform:scale(.2);opacity:1}to{transform:scale(1.4) translateY(-40px);opacity:0}}
.conf{position:absolute;top:-4vh;pointer-events:none;z-index:3;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r)) rotateY(1440deg)}}
.burst{position:absolute;pointer-events:none;z-index:4;transition:transform 1.1s cubic-bezier(.1,.8,.3,1),opacity 1.1s ease-in}
.ring{position:absolute;border:4px solid #fff;border-radius:50%;pointer-events:none;z-index:4;animation:ring .6s ease-out forwards}
@keyframes ring{from{width:0;height:0;margin:0;opacity:1}to{width:160px;height:160px;margin:-80px;opacity:0}}
.emo{position:absolute;font-size:44px;pointer-events:none;z-index:5;animation:emo 1s ease-out forwards}
@keyframes emo{0%{transform:translate(-50%,-50%) scale(.3)}30%{transform:translate(-50%,-80%) scale(1.3)}100%{transform:translate(-50%,-200%) scale(1);opacity:0}}
.bubble{position:absolute;z-index:6;pointer-events:none;font-weight:900;white-space:nowrap;padding:.35em .8em;border-radius:1.2em;
  background:#fff;box-shadow:0 4px 0 #0004;transition:transform .45s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.bubble::after{content:"";position:absolute;width:0;height:0;border:.5em solid transparent}
.bubble.from-top::after{top:-.9em;left:50%;margin-left:-.5em;border-bottom:.6em solid #fff}
.bubble.from-bottom::after{bottom:-.9em;left:50%;margin-left:-.5em;border-top:.6em solid #fff}
.bubble.from-right::after{right:-.9em;top:50%;margin-top:-.5em;border-left:.6em solid #fff}
.bubble.from-left::after{left:-.9em;top:50%;margin-top:-.5em;border-right:.6em solid #fff}
/* ニコニコ風コメント */
.cmt{position:absolute;left:100vw;z-index:8;pointer-events:none;white-space:nowrap;font-weight:900;color:#fff;
  -webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 2px 6px #0008;animation:flow linear forwards}
.cmt.mine{color:#ffe14d}
@keyframes flow{to{transform:translateX(calc(-100vw - 100%))}}
#cform{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:10;display:none;gap:6px;width:min(560px,94vw)}
#cform.open{display:flex}
#cinput{flex:1;font:inherit;font-size:16px;padding:10px 14px;border-radius:999px;border:0}
#csend{font:inherit;font-weight:bold;border:0;border-radius:999px;padding:10px 16px;background:#ff5fa2;color:#fff;cursor:pointer}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:10;background:#000c;color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none}
.praise{position:absolute;z-index:6;pointer-events:none;font-weight:900;white-space:nowrap;
  -webkit-text-stroke:3px #fff;paint-order:stroke fill;text-shadow:0 0 18px #fff,0 4px 0 #0006;animation:praise 2.2s ease-out forwards}
@keyframes praise{0%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(0)}15%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1.25)}
  25%{transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) rotate(var(--rot)) scale(1.05);opacity:0}}
/* ペンライト */
.pen{position:absolute;width:14px;height:120px;margin-left:-7px;border-radius:7px;transform-origin:50% 100%;pointer-events:none;z-index:5}
.pen::after{content:"";position:absolute;left:2px;right:2px;bottom:-34px;height:36px;background:#222;border-radius:4px}
#myPen{width:22px;height:170px;margin-left:-11px;display:none;z-index:7}
#pens{position:absolute;left:0;right:0;bottom:0;height:0;z-index:5;display:none}
.on #pens,.on #myPen{display:block}
#ui,#ui2{z-index:9;position:fixed;left:0;right:0;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 8px}
#ui{top:10px}#ui2{bottom:12px}
#ui>*,#ui2>*{font:inherit;font-size:14px;border:0;border-radius:999px;padding:9px 14px;background:#000b;color:#fff;display:flex;align-items:center;gap:6px}
#ui2 button{cursor:pointer;font-weight:bold;font-size:15px}
#ui2 button.sel{background:#fff;color:#000}
#start,#praiseBtn{background:#fff!important;color:#000!important;font-weight:bold;cursor:pointer}
#praiseBtn{background:linear-gradient(90deg,#ff5fa2,#ffd23f)!important}
select{font:inherit;font-size:14px;border-radius:8px;border:0;padding:2px 4px}
#hint{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);color:#fff;background:#0008;padding:4px 12px;border-radius:999px;font-size:12px;z-index:8;pointer-events:none;transition:opacity 1s}
</style></head><body>
<div id="stage"><div id="rays"></div><div id="spots"></div>
  <div id="glow"></div><div id="dancer"><div class="layer ink" id="ink"></div><div class="layer rainbow" id="rb"></div></div>
  <div id="pens"></div><div class="pen" id="myPen"></div>
</div>
<div id="ui">
  <button id="start">▶ BGM</button>
  <label>曲 <select id="style">
    <option value="edm">EDM</option><option value="jazz">ジャズ</option>
    <option value="piano">優しいピアノ</option><option value="pop">ポップ可愛い</option></select></label>
  <label>横揺れ <select id="sway">
    <option value="0">なし</option><option value="1" selected>ちょっと</option><option value="2.5">大きめ</option><option value="5">めっちゃ</option></select></label>
  <label>BPM <input id="bpmIn" type="range" min="60" max="180" value="128" style="width:80px"> <span id="bpmV">128</span></label>
</div>
<div id="ui2">
  <button id="cmtBtn">💬 コメント</button>
  <button id="praiseBtn">💖 褒める！</button>
  <button id="cheerBtn">📣 歓声</button>
  <button id="penBtn">🔦 ペンライト</button>
  <button class="tool sel" data-tool="cracker">🎉 クラッカー</button>
  <button class="tool" data-tool="tambourine">🪘 タンバリン</button>
  <button class="tool" data-tool="clap">👏 拍手</button>
</div>
<form id="cform"><input id="cinput" maxlength="40" placeholder="霊幻への歓声・褒め言葉（40文字まで）" autocomplete="off"><button id="csend">送信</button></form>
<div id="toast"></div>
<div id="hint">画面タップで鳴らせるよ！</div>
<script>
const $=id=>document.getElementById(id);
const dancer=$('dancer'),rb=$('rb'),ink=$('ink'),stage=$('stage');
let bpm=128,lastBeat=-1,ctx=null,t0=performance.now(),hue=0,style='edm',swayAmt=1,tool='cracker',penOn=false;
const setBpm=v=>{bpm=+v;$('bpmIn').value=bpm;$('bpmV').textContent=bpm};
$('bpmIn').oninput=e=>setBpm(e.target.value);
$('sway').onchange=e=>swayAmt=+e.target.value;
$('style').onchange=e=>{style=e.target.value;setBpm(STYLES[style].bpm)};
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---- 見た目 ---- */
const spots=[...Array(4)].map((_,i)=>{const e=document.createElement('div');e.className='spot';e.style.left=(12+i*25.3)+'%';$('spots').appendChild(e);return e});
const pens=[...Array(14)].map((_,i)=>{const e=document.createElement('div');e.className='pen';e.style.left=(3.5+i*7.1)+'%';e.style.bottom='-30px';$('pens').appendChild(e);return e});
function nowMs(){return ctx?ctx.currentTime*1000:performance.now()-t0}
function tick(){
  const spb=60000/bpm,t=nowMs(),b=Math.floor(t/spb),p=(t%spb)/spb;
  if(b!==lastBeat){lastBeat=b;onBeat(b)}
  const calm=style==='piano'?.45:1;
  const up=Math.sin(p*Math.PI)*calm;
  const sq=p<.12?1-(.12-p)*1.2*calm:1;
  const flip=b%2?-1:1;
  const sway=Math.sin((t/spb)*Math.PI)*swayAmt;
  dancer.style.transform=`translateX(${sway*2}vw) translateY(${-up*5}vh) rotate(${sway*1.5}deg) scaleX(${flip*(2-sq)}) scaleY(${sq})`;
  spots.forEach((e,i)=>e.style.transform=`rotate(${Math.sin(t/1400+i*1.7)*28}deg)`);
  if(penOn)pens.forEach((e,i)=>e.style.transform=`rotate(${Math.sin((t/spb)*Math.PI+(i%2)*.4)*30}deg)`);
  requestAnimationFrame(tick);
}
function onBeat(b){
  hue=(hue+67)%360;
  const h2=(hue+120)%360,h3=(hue+240)%360,mode=b%4;
  if(mode%2){
    stage.style.background=`radial-gradient(circle,hsl(${hue} 80% 18%),#050505 70%)`;
    rb.style.opacity=1;ink.style.opacity=0;
  }else{
    stage.style.background=mode===0
      ?`linear-gradient(${b*37%360}deg,hsl(${hue} 100% 60%),hsl(${h2} 100% 60%),hsl(${h3} 100% 60%))`
      :`conic-gradient(from ${b*23}deg,hsl(${hue} 100% 60%),hsl(${h2} 100% 55%),hsl(${h3} 100% 60%),hsl(${hue} 100% 60%))`;
    rb.style.opacity=0;ink.style.opacity=1;
  }
  $('glow').style.background=`hsl(${h2} 100% 60%)`;
  for(let i=0;i<(style==='piano'?4:12);i++)dot();
  rain(style==='piano'?6:(b%4===0?40:18));
  spots.forEach((e,i)=>e.style.background=`linear-gradient(hsla(${(hue+i*90)%360} 100% 75% / .95),hsla(${(hue+i*90)%360} 100% 60% / 0))`);
  if(penOn){pens.forEach((e,i)=>glowPen(e,(hue+i*25)%360));glowPen($('myPen'),hue)}
}
function glowPen(e,h){e.style.background=`hsl(${h} 100% 70%)`;e.style.boxShadow=`0 0 18px 6px hsl(${h} 100% 60%),0 0 40px 14px hsl(${h} 100% 50% / .6)`}
function dot(){
  const e=document.createElement('div'),s=rnd(10,40);e.className='dot';
  Object.assign(e.style,{width:s+'px',height:s+'px',left:rnd(0,100)+'vw',top:rnd(0,100)+'vh',background:`hsl(${rnd(0,360)} 100% 60%)`});
  stage.appendChild(e);setTimeout(()=>e.remove(),900);
}
function rain(n){
  for(let i=0;i<n;i++){
    const e=document.createElement('div'),w=rnd(6,16),dur=rnd(2.5,5);e.className='conf';
    Object.assign(e.style,{left:rnd(0,100)+'vw',width:w+'px',height:w*(Math.random()<.5?1.8:.6)+'px',
      background:`hsl(${rnd(0,360)} 100% 60%)`,borderRadius:Math.random()<.3?'50%':'2px',animationDuration:dur+'s',animationDelay:rnd(0,.4)+'s'});
    e.style.setProperty('--dx',rnd(-15,15)+'vw');e.style.setProperty('--r',rnd(-720,720)+'deg');
    stage.appendChild(e);setTimeout(()=>e.remove(),(dur+.5)*1000);
  }
}
requestAnimationFrame(tick);

/* ---- 音の部品 ---- */
let master,pad,rev,noiseBuf,next16=0,step=0,timer=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ctx)return;ctx=new AudioContext();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=6;
  master=ctx.createGain();master.gain.value=.8;master.connect(comp).connect(ctx.destination);
  pad=ctx.createGain();pad.connect(master);                 // EDMのポンプ用
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
  const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;
  // 簡易リバーブ
  rev=ctx.createConvolver();const L=ctx.sampleRate*2.2,ir=ctx.createBuffer(2,L,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
  rev.buffer=ir;const rg=ctx.createGain();rg.gain.value=.35;rev.connect(rg).connect(master);
  timer=setInterval(schedule,25);
}
let playing=false;
function schedule(){if(!playing)return;
  const s16=60/bpm/4;
  while(next16<ctx.currentTime+.12){STYLES[style].play(step,next16,s16);next16+=s16;step++}
}
function env(g,t,a,peak,d){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function osc(type,f,t,d,vol,dest,{a=.005,detune=0,lp=0}={}){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;o.detune.value=detune;
  let n=o;if(lp){const fl=ctx.createBiquadFilter();fl.frequency.value=lp;o.connect(fl);n=fl}
  env(g,t,a,vol,d);n.connect(g).connect(dest||master);o.start(t);o.stop(t+d+.05);return g;
}
function kick(t,v=1.2,f=160){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  env(g,t,.002,v,.35);o.connect(g).connect(master);o.start(t);o.stop(t+.4);
}
function noise(t,dur,type,f,vol,dest){
  const n=ctx.createBufferSource(),fl=ctx.createBiquadFilter(),g=ctx.createGain();
  n.buffer=noiseBuf;n.playbackRate.value=.5+Math.random();fl.type=type;fl.frequency.value=f;env(g,t,.001,vol,dur);
  n.connect(fl).connect(g).connect(dest||master);n.start(t);n.stop(t+dur+.05);
}
const hat=(t,v,d)=>noise(t,d,'highpass',8000,v);
const clap=t=>{noise(t,.18,'bandpass',1500,.7);noise(t+.012,.15,'bandpass',1800,.5)};
function piano(m,t,d,v=.18){ // 減衰する柔らかい音＋リバーブ
  [[1,'triangle',v],[2,'sine',v*.35],[3,'sine',v*.12]].forEach(([h,ty,vv])=>{
    const g=osc(ty,mtof(m)*h,t,d,vv,master,{a:.004});g.connect(rev);
  });
}

/* ---- 曲 ---- */
const STYLES={
  edm:{bpm:128,play(s,t,s16){
    const chords=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
    const st=s%16,bar=Math.floor(s/16),ch=chords[bar%4],drop=(bar%8)>=2;
    if(st%4===0)kick(t);
    if(st%4===2)hat(t,.25,.08);
    if(drop&&st%2===1)hat(t,.06,.02);
    if(st===4||st===12)clap(t);
    if(st%4===2)osc('sawtooth',mtof(ch[0]-24),t,s16*1.6,.45,master,{lp:600});
    if(st===0)ch.forEach(m=>[-14,-6,0,6,14].forEach(dt=>osc('sawtooth',mtof(m),t,s16*15,.05,pad,{a:.05,detune:dt,lp:2500})));
    if(drop){const arp=[0,1,2,1,2,0,2,1];osc('square',mtof(ch[arp[st%8]]+12+(st>=8?12:0)),t,s16*.9,.07,pad,{a:.003})}
    if(st%4===0){pad.gain.cancelScheduledValues(t);pad.gain.setValueAtTime(.15,t);pad.gain.linearRampToValueAtTime(1,t+s16*3)}
  }},
  jazz:{bpm:120,play(s,t,s16){ // ii-V-I-VI のスウィング
    const prog=[[50,53,57,60],[55,59,62,65],[48,52,55,59],[57,61,64,67]];
    const walk=[[38,41,45,48],[43,47,50,53],[36,40,43,47],[45,49,52,55]];
    const st=s%16,bar=Math.floor(s/16)%4;
    const sw=st%4===2?s16*.33:0, tt=t+sw;             // 裏をハネさせる
    if(st%4===0)osc('triangle',mtof(walk[bar][st/4]),t,s16*3.5,.35,master,{lp:900}); // ウォーキングベース
    if(st%4===0||(st%8===6))noise(tt,.25,'highpass',6000,.12);                       // ライド
    if(st===4||st===12)noise(t,.05,'highpass',7000,.12);                             // ハイハット踏み
    if(st===6||st===14)prog[bar].forEach(m=>piano(m,tt,.6,.06));                     // コンピング
    if(st===0&&bar%2===0)prog[bar].forEach(m=>piano(m,t,.9,.05));
    if(Math.random()<.35&&st%2===0){const sc=[0,3,5,6,7,10,12];                       // ピアノのアドリブ
      piano(prog[bar][0]+12+sc[Math.floor(Math.random()*sc.length)],tt,.35,.09)}
  }},
  piano:{bpm:76,play(s,t,s16){ // C-G-Am-F のアルペジオ
    const prog=[[48,55,60,64,67],[43,50,55,59,62],[45,52,57,60,64],[41,48,53,57,60]];
    const mel=[76,74,72,74,76,76,76,null,74,74,74,null,76,79,79,null];
    const st=s%16,bar=Math.floor(s/16),ch=prog[bar%4];
    if(st%2===0){const pat=[0,1,2,3,4,3,2,1];piano(ch[pat[st/2]],t,1.6,.11)}
    if(st===0)piano(ch[0]-12,t,2.5,.14);
    const m=mel[(bar%2)*8+Math.floor(st/2)];
    if(st%4===0&&m&&bar%4>=2)piano(m,t,1.2,.1);
  }},
  pop:{bpm:140,play(s,t,s16){ // F-G-Em-Am のキラキラ
    const prog=[[53,57,60],[55,59,62],[52,55,59],[57,60,64]];
    const mel=[72,74,76,79,76,74,72,74, 76,null,79,81,79,76,74,null];
    const st=s%16,bar=Math.floor(s/16),ch=prog[bar%4];
    if(st===0||st===8||st===10)kick(t,.8,220);
    if(st===4||st===12){clap(t);noise(t,.1,'bandpass',3000,.3)}
    if(st%2===0)noise(t,.03,'highpass',9000,.12);
    if(st%4===0)osc('square',mtof(ch[0]-12),t,s16*1.5,.12,master,{lp:1500});
    if(st%2===1)ch.forEach(m=>osc('triangle',mtof(m+12),t,s16*.8,.05));             // 刻みコード
    if(st%2===0){const m=mel[st/2+(bar%2)*8];if(m){osc('square',mtof(m),t,s16*1.6,.06,master,{lp:3000});
      osc('sine',mtof(m+12),t,s16*2.5,.06).connect(rev)}}                             // ベル
    if(st===14&&bar%4===3)[84,88,91,96].forEach((m,i)=>osc('sine',mtof(m),t+i*s16/4,.3,.05).connect(rev));
  }},
};


/* ---- こっちから鳴らす音 ---- */
function sCracker(){
  noise(ctx.currentTime,.25,'highpass',1200,1.4);noise(ctx.currentTime,.08,'lowpass',400,1.2);
  for(let i=0;i<6;i++)osc('sine',rnd(2000,5000),ctx.currentTime+rnd(.05,.3),.15,.04).connect(rev);
}
function sTamb(){
  const t=ctx.currentTime;
  for(let i=0;i<5;i++){noise(t+i*.012,.3,'bandpass',rnd(7000,10000),.35);osc('square',rnd(4800,6200),t+i*.01,.2,.02,master,{lp:9000})}
  noise(t,.05,'lowpass',300,.5);
}
function sClap(){noise(ctx.currentTime,.09,'bandpass',rnd(1300,1900),.9)}
function sCheer(){
  const t=ctx.currentTime;
  for(let i=0;i<18;i++){ // 「わ〜〜！」：ウ→アへ母音を動かす合成声
    const st=t+rnd(0,.25),dur=rnd(1.6,2.4),f0=Math.random()<.5?rnd(180,280):rnd(300,480);
    const o=ctx.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(f0*.85,st);o.frequency.linearRampToValueAtTime(f0*1.15,st+.35);o.frequency.linearRampToValueAtTime(f0*.95,st+dur);
    const vib=ctx.createOscillator(),vg=ctx.createGain();vib.frequency.value=rnd(5,7);vg.gain.value=f0*.03;vib.connect(vg).connect(o.frequency);
    const g=ctx.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.05,st+.12);g.gain.setValueAtTime(.05,st+dur*.6);g.gain.linearRampToValueAtTime(0,st+dur);
    [[300,800,.9],[700,1250,1],[2500,2600,.35]].forEach(([fa,fb,v])=>{ // フォルマント（ウ→ア）
      const f=ctx.createBiquadFilter(),fg=ctx.createGain();f.type='bandpass';f.Q.value=6;
      f.frequency.setValueAtTime(fa*(f0>290?1.15:1),st);f.frequency.linearRampToValueAtTime(fb*(f0>290?1.15:1),st+.18);
      fg.gain.value=v*4;o.connect(f).connect(fg).connect(g);
    });
    g.connect(master);g.connect(rev);o.start(st);vib.start(st);o.stop(st+dur+.05);vib.stop(st+dur+.05);
  }
  for(let i=0;i<10;i++){ // ざわざわ
    const n=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    n.buffer=noiseBuf;n.loop=true;f.type='bandpass';f.Q.value=3;f.frequency.value=rnd(500,2500);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(rnd(.08,.18),t+rnd(.15,.4));g.gain.linearRampToValueAtTime(0,t+rnd(2,3));
    n.connect(f).connect(g).connect(master);n.start(t);n.stop(t+3.2);
  }
  for(let i=0;i<8;i++){ // 「ウー！」「キャー！」
    const o=ctx.createOscillator(),g=ctx.createGain(),st=t+rnd(0,.8),f0=rnd(300,900);
    o.type='sawtooth';o.frequency.setValueAtTime(f0,st);o.frequency.linearRampToValueAtTime(f0*rnd(1.3,1.9),st+.4);o.frequency.linearRampToValueAtTime(f0*1.1,st+1);
    const fl=ctx.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f0*2;fl.Q.value=2;
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.05,st+.1);g.gain.linearRampToValueAtTime(0,st+1.1);
    o.connect(fl).connect(g).connect(rev);g.connect(master);o.start(st);o.stop(st+1.2);
  }
  for(let i=0;i<2;i++){ // 指笛
    const o=ctx.createOscillator(),g=ctx.createGain(),st=t+rnd(.2,1);
    o.frequency.setValueAtTime(1800,st);o.frequency.exponentialRampToValueAtTime(3200,st+.25);o.frequency.exponentialRampToValueAtTime(2200,st+.6);
    g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.08,st+.05);g.gain.linearRampToValueAtTime(0,st+.6);
    o.connect(g).connect(master);o.start(st);o.stop(st+.7);
  }
  for(let i=0;i<40;i++)setTimeout(sClap,rnd(0,2200));
}

/* ---- こっちから出す演出 ---- */
function crackerFx(x,y){
  for(let i=0;i<40;i++){
    const e=document.createElement('div'),w=rnd(6,14),a=rnd(-Math.PI*.95,-Math.PI*.05),d=rnd(80,320);
    e.className='burst';
    Object.assign(e.style,{left:x+'px',top:y+'px',width:w+'px',height:w*rnd(.5,2)+'px',background:`hsl(${rnd(0,360)} 100% 60%)`});
    stage.appendChild(e);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+rnd(60,180)}px) rotate(${rnd(-720,720)}deg)`;e.style.opacity=0}));
    setTimeout(()=>e.remove(),1200);
  }
  emo(x,y,'🎉');
}
function ring(x,y,c){const e=document.createElement('div');e.className='ring';Object.assign(e.style,{left:x+'px',top:y+'px',borderColor:c});stage.appendChild(e);setTimeout(()=>e.remove(),600)}
function emo(x,y,ch){const e=document.createElement('div');e.className='emo';e.textContent=ch;Object.assign(e.style,{left:x+'px',top:y+'px'});stage.appendChild(e);setTimeout(()=>e.remove(),1000)}

const PRAISE=['れいげーん！','最高！！','霊幻ー！！','師匠ー！','かっこいいー！','顔がいい！！','スーツが似合う！','天才！！','世紀の霊能力者！',
 '踊りうますぎ！','キレッキレ！','腰の動きがいい！','優勝！！','世界一！','宇宙一！','国宝！','存在が尊い…','ありがとう霊幻！','一生ついていきます！',
 '推しが今日も生きてる！','最強！','伝説！','神ーー！','愛してるーー！','こっち見てー！','ウインクしてー！','ファンサしてー！','ソルトスプラッシュ！',
 '霊とか相談所 万歳！','お誕生日おめでとう！','生まれてきてくれてありがとう！','好きーー！','輝いてる！！','オーラがすごい！','リズム感天才！',
 '足長い！！','ネクタイまでかっこいい！','ブラボー！','FOOOOO↑','やばい！！','かわいいーー！','今日も元気で偉い！','スター誕生！','アンコール！'];
/* 吹き出しの出る場所（重ならないよう枠ごとに1つ） */
const SLOTS=[
  {side:'bottom',x:22,y:80},{side:'bottom',x:50,y:80},{side:'bottom',x:78,y:80},
  {side:'left',x:3,y:30},{side:'left',x:3,y:46},{side:'left',x:3,y:62},
  {side:'right',x:97,y:30},{side:'right',x:97,y:46},{side:'right',x:97,y:62},
  {side:'top',x:30,y:16},{side:'top',x:70,y:16}];
const busy=new Array(SLOTS.length).fill(0);
function praise(txt){
  txt=txt||pick(PRAISE);
  const now=performance.now(),free=SLOTS.map((_,i)=>i).filter(i=>busy[i]<now);
  if(!free.length)return;
  const i=pick(free),sl=SLOTS[i];busy[i]=now+2400;
  const e=document.createElement('div');e.className='bubble from-'+sl.side;e.textContent=txt;
  const vw=innerWidth/100,mob=innerWidth<600;
  const maxW=(sl.side==='left'||sl.side==='right')?(mob?44:32):(mob?40:30);   // 枠の幅（vw）
  const fs=Math.min(mob?20:30,maxW*vw/(txt.length+1.6));
  Object.assign(e.style,{fontSize:fs+'px',color:`hsl(${rnd(0,360)} 90% 45%)`,top:sl.y+'vh'});
  let hide;
  if(sl.side==='left'){e.style.left=sl.x+'vw';e.style.transform='translate(-130vw,-50%)';hide='translate(-130vw,-50%)'}
  else if(sl.side==='right'){e.style.right=(100-sl.x)+'vw';e.style.transform='translate(130vw,-50%)';hide='translate(130vw,-50%)'}
  else{e.style.left=sl.x+'vw';const off=sl.side==='bottom'?'60vh':'-60vh';e.style.transform=`translate(-50%,${off})`;hide=`translate(-50%,${off})`}
  stage.appendChild(e);
  const show=(sl.side==='left'||sl.side==='right')?'translate(0,-50%)':'translate(-50%,-50%)';
  requestAnimationFrame(()=>requestAnimationFrame(()=>e.style.transform=show));
  setTimeout(()=>{e.style.transform=hide.replace('130vw','0').replace('60vh','8vh')+' scale(.6)';e.style.opacity=0},1900);
  setTimeout(()=>e.remove(),2400);
  if(ctx){const t=ctx.currentTime;[0,4,7,12].forEach((m,i)=>osc('sine',mtof(84+m),t+i*.04,.25,.05).connect(rev))}
}

/* ---- 操作 ---- */
const ensure=()=>initAudio();
$('start').onclick=()=>{
  ensure();playing=!playing;
  if(playing){next16=ctx.currentTime+.1;step=0;lastBeat=-1;$('start').textContent='■ BGM'}
  else $('start').textContent='▶ BGM';
};
document.querySelectorAll('.tool').forEach(bt=>bt.onclick=()=>{
  tool=bt.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x===bt));
});
$('praiseBtn').onclick=()=>{ensure();praise()};
$('cheerBtn').onclick=()=>{ensure();sCheer();praise(pick(['わ〜〜！！','わーーー！！','キャーーー！！','うおおお！！']));setTimeout(praise,400);setTimeout(praise,800);rain(60)};
$('penBtn').onclick=()=>{penOn=!penOn;document.body.classList.toggle('on',penOn);$('penBtn').classList.toggle('sel',penOn);
  if(penOn){pens.forEach((e,i)=>glowPen(e,(hue+i*25)%360));glowPen($('myPen'),hue)}};
let lastX=null;
function movePen(x,y){const p=$('myPen');p.style.left=x+'px';p.style.top=(y-150)+'px';
  const v=lastX==null?0:x-lastX;lastX=x;p.style.transform=`rotate(${Math.max(-45,Math.min(45,v*2))}deg)`}
stage.addEventListener('pointermove',e=>{if(penOn)movePen(e.clientX,e.clientY)});
stage.addEventListener('pointerdown',e=>{
  ensure();const x=e.clientX,y=e.clientY;
  if(penOn){movePen(x,y);ring(x,y,`hsl(${hue} 100% 70%)`);return}
  if(tool==='cracker'){sCracker();crackerFx(x,y)}
  else if(tool==='tambourine'){sTamb();ring(x,y,'#ffd23f');ring(x+rnd(-20,20),y+rnd(-20,20),'#fff');emo(x,y,'🪘')}
  else{sClap();emo(x,y,'👏')}
  $('hint').style.opacity=0;
});
setTimeout(()=>$('hint').style.opacity=0,6000);

/* ---- みんなのコメント（ニコニコ風） ----
   API_URL に Google Apps Script のウェブアプリURLを入れると、
   送信→スプレッドシートに溜まる→管理者が「表示」にチェック→全員の画面に流れる。 */
const API_URL='';
const lanes=[];
function flow(txt,mine){
  const e=document.createElement('div');e.className='cmt'+(mine?' mine':'');e.textContent=txt;
  const n=innerWidth<600?7:9,now=performance.now();
  let lane=0,best=1e18;for(let i=0;i<n;i++){const f=lanes[i]||0;if(f<best){best=f;lane=i}if(f<now){lane=i;break}}
  const fs=innerWidth<600?22:34,dur=rnd(6,8);
  Object.assign(e.style,{top:(14+lane*(66/n))+'vh',fontSize:fs+'px',animationDuration:dur+'s'});
  stage.appendChild(e);
  lanes[lane]=now+dur*1000*(e.offsetWidth+innerWidth*.15)/(innerWidth+e.offsetWidth); // 後ろが入りきるまで同じ段は空けない
  setTimeout(()=>e.remove(),dur*1000+100);
}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2500)}
const placeForm=()=>$('cform').style.bottom=($('ui2').offsetHeight+22)+'px';addEventListener('resize',placeForm);
$('cmtBtn').onclick=()=>{placeForm();$('cform').classList.toggle('open');$('cmtBtn').classList.toggle('sel');if($('cform').classList.contains('open'))$('cinput').focus()};
$('cform').onsubmit=async e=>{
  e.preventDefault();const txt=$('cinput').value.trim();if(!txt)return;
  $('cinput').value='';flow(txt,true);  // 自分の画面にはすぐ流す（黄色）
  if(!API_URL){toast('（サーバー未設定：自分の画面だけに流れます）');return}
  try{await fetch(API_URL,{method:'POST',body:JSON.stringify({text:txt})});toast('送信しました！承認されるとみんなの画面に流れます')}
  catch(_){toast('送信に失敗しました…')}
};
let approved=[],seen=new Set(),fresh=[];
async function poll(){
  if(!API_URL)return;
  try{const r=await fetch(API_URL+'?t='+Date.now());const j=await r.json();
    approved=j.comments||[];approved.forEach(c=>{if(!seen.has(c)){seen.add(c);fresh.push(c)}});
  }catch(_){}
}
if(API_URL){poll();setInterval(poll,15000);
  setInterval(()=>{if(fresh.length)flow(fresh.shift());else if(approved.length)flow(pick(approved))},1800)}
